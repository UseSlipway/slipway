name: Contracts CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    if: github.repository == 'UseSlipway/slipway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.5
      - run: forge build
      - run: forge test
      - name: Enforce fee router line coverage
        run: |
          forge coverage --report lcov --report-file /tmp/contracts-coverage.lcov
          python3 ../scripts/check_contract_coverage.py /tmp/contracts-coverage.lcov --source src/SlipwayFeeRouter.sol --minimum 95
