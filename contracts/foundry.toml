[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "osaka"
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read", path = "./wallet.json" }]

[fuzz]
runs = 1000

[invariant]
runs = 1000
depth = 100
fail_on_revert = false

[rpc_endpoints]
rhc = "${RHC_RPC_URL}"
base = "${BASE_RPC_URL}"
bsc = "${BNB_RPC_URL}"
